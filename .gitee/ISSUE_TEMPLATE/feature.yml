name: 功能建议
description: 提出新特性或结构优化建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: 你希望增加什么功能？
      placeholder: 比如：支持热更新 IOC 映射关系
      validations:
        required: true
  - type: textarea
    attributes:
      label: 为什么需要这个功能？
      description: 背景或使用场景
  - type: textarea
    attributes:
      label: 你希望的实现方式（可选）
      description: 可以附上代码建议或伪代码
  - type: textarea
    attributes:
      label: 补充说明（可选）
